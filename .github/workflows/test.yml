name: test

on:
  push:
  pull_request:

jobs:
  forge-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-git

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vv
